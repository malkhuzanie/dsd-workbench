[package]
name = "dsdiff-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
dsdiff = { package = "dsd-workbench-dsdiff", path = ".." }

# Keep the fuzz package out of the parent workspace.
[workspace]

[[bin]]
name = "read_info"
path = "fuzz_targets/read_info.rs"
test = false
doc = false
bench = false