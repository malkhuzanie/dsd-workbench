[package]
name = "dsf-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
dsf = { package = "dsd-workbench-dsf", path = ".." }

# Keep the fuzz package out of the parent workspace.
[workspace]

[[bin]]
name = "header"
path = "fuzz_targets/header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tag"
path = "fuzz_targets/tag.rs"
test = false
doc = false
bench = false