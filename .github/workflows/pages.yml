name: Pages

# Publishes the static site in `site/` (plain HTML, CSS and JS). The documentation pages are
# generated from `docs/` with pandoc just before publishing.
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build the documentation pages
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          site/tools/build-docs.sh
      - name: Leave out the build tools
        run: rm -rf site/tools
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
