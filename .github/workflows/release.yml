name: Release

# Push a tag such as v0.1.0 to build and publish binaries for Windows, macOS and Linux.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            archive: tar.gz
          - name: macos-arm64
            os: macos-latest
            archive: tar.gz
          - name: macos-x86_64
            os: macos-13
            archive: tar.gz
          - name: windows-x86_64
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --release
      - name: Build
        run: cargo build --release -p dsd-workbench
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          dir="dsd-workbench-${version}-${{ matrix.name }}"
          mkdir "$dir"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/dsd-workbench.exe "$dir/"
          else
            cp target/release/dsd-workbench "$dir/"
          fi
          cp README.md CHANGELOG.md "$dir/"
          cp -r docs "$dir/docs"
          rm -f "$dir/docs/PLAN.md"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$dir.zip" "$dir"
            echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
          else
            tar czf "$dir.tar.gz" "$dir"
            echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then
            sha256sum "$ASSET" > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          generate_release_notes: true
